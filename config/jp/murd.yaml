name: murd
sha1: b684a4b33218915fe3de3d3bf22debff52bd16ed
options:
  basename: murd
  target_path: disks/jp/MURD_REL.BIN
  base_path: ../..
  platform: psx
  compiler: PSYQ

  asm_path: asm/jp/murd
  src_path: src/murd
  asset_path: build/jp/psx/generated/assets/murd
  build_path: build

  ld_script_path: build/jp/psx/generated/murd.ld

  global_vram_start: 0x80000000
  global_vram_end: 0x80200000

  gp_value: 0x80144E0C

  generate_asm_macros_files: False

  section_order: [".text", ".rodata", ".data", ".sdata", ".sbss", ".bss"]

  symbol_addrs_path:
    - config/jp/symbols.txt

  undefined_funcs_auto_path: build/jp/psx/generated/undefined_funcs_auto_murd.txt
  undefined_syms_auto_path: build/jp/psx/generated/undefined_syms_auto_murd.txt

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  migrate_rodata_to_functions: False

  create_data_pads: False

  use_gp_rel_macro: True

  symbol_name_format: $VRAM_murd
  symbol_name_format_no_rom: $VRAM_murd

segments:
  - name: header
    type: rodata
    start: 0x0
    vram: 0x8007C000
    align: 4
    subalign: 4

  - name: murd
    type: code
    start: 0x40
    vram: 0x8007C040
    align: 4
    subalign: 4
    subsegments:
      - [0x40, asm, murd]
      - [0x21C0, data, murd]

  - [0x33D4]
